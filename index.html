function beeTone(freq,duration,gain,type='sine',when=null){const c=beeAudioContext();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,c.currentTime);const t=when==null?c.currentTime:Math.max(when,c.currentTime);g.gain.linearRampToValueAtTime(gain,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+0.02)}catch(e){}}

function submitBee(timeout=false){
 if(activity.submitted||activity.transitioning)return;
 const input=document.getElementById('beeInput');
 if(!input&&!timeout)return;
 activity.submitted=true;
 activity.transitioning=true;
 stopTimer();
 stopBeeMusic();
 if('speechSynthesis' in window)speechSynthesis.cancel();
 if(window.__beeRoundAdvanceTimer){clearTimeout(window.__beeRoundAdvanceTimer);window.__beeRoundAdvanceTimer=null}
 const submitBtn=document.querySelector('.bee-submit-icon');
 if(submitBtn)submitBtn.disabled=true;
 if(input)input.disabled=true;
 const hintButtons=document.querySelectorAll('.bee-icon-action');
 hintButtons.forEach(b=>b.disabled=true);
 const w=getWord(activity.words[activity.index]);
 if(!w){activity.transitioning=false;return;}
 const answer=input?input.value.trim():'';
 const correct=!timeout&&answer!==''&&normalizeSpelling(answer)===normalizeSpelling(w.word);
 let points=0,why=[];
 if(correct){
   points=activity.hints===0?100:activity.hints===1?75:50;
   if(w.difficulty==='hard'){points+=25;why.push('Hard-word bonus +25')}
   if(activity.timeLeft>=20){points+=10;why.push('Fast answer bonus +10')}
   activity.streak++;
   activity.bestStreak=Math.max(activity.bestStreak,activity.streak);
   why.unshift(activity.hints===0?'No-hint +100':activity.hints===1?'One hint +75':'Two hints +50');
   if(activity.streak===5){points+=25;why.push('5-streak bonus +25')}
   if(activity.streak===10){points+=50;why.push('10-streak bonus +50')}
 }else activity.streak=0;
 activity.score+=points;
 try{recordAnswer(w,correct,{bee:true,mode:'bee',hints:activity.hints,hard:w.difficulty==='hard'});}catch(err){console.error('Bee answer save error:',err);}
 activity.rounds.push({word:w.word,correct,answer,points});
 const feedback=document.getElementById('beeFeedback');
 if(feedback)feedback.innerHTML=`<div class="feedback show ${correct?'correct':'wrong'} bee-feedback-clean"><div class="feedback-title">${correct?'✓ CORRECT!':'✕ NOT QUITE!'}</div><div class="feedback-answer">${correct?`<strong>${w.word}</strong>`:`Your answer: <strong>${escapeHTML(answer||'No answer')}</strong>`}</div><div class="round-reward">${correct?why.map(x=>`<span class="reward-chip">${x}</span>`).join(''):'Keep going.'}</div></div>`;
 if(correct){confetti(8);playSfx('correct')}else playSfx('wrong');
 window.__beeRoundAdvanceTimer=setTimeout(()=>{
   window.__beeRoundAdvanceTimer=null;
   if(!activity||activity.mode!=='bee')return;
   activity.transitioning=false;
   if(activity.index>=(activity.beeLength||activity.words.length)-1)finishBee();
   else{activity.index++;renderBeeRound();}
 },650);
}

function finishBee(){stopTimer();stopBeeMusic();const total=activity.beeLength||10;const correct=activity.rounds.filter(x=>x.correct).length;const acc=Math.round(correct/total*100);const missed=activity.rounds.filter(x=>!x.correct).map(x=>x.word);const sessionDiffs=[...(activity.beeDifficulties||[])];const sessionDifficulty=sessionDiffs.length===1?sessionDiffs[0]:'mixed';const s={date:today(),mode:'Time Mode',difficulty:sessionDifficulty,difficulties:sessionDiffs,words:total,correct,accuracy:acc,score:activity.score,scoreCorrect:correct,bestStreak:activity.bestStreak,completed:true,missed};state.history.unshift(s);state.history=state.history.slice(0,60);updateSessionGoals('bee');state.personalBests.beeScore=Math.max(state.personalBests.beeScore,activity.score);state.bestStreak=Math.max(state.bestStreak,activity.bestStreak);ensureAchievements();saveState();document.getElementById('app').innerHTML=`<div class="bee-arena"><div class="bee-shell"><div class="bee-top"><div></div><div class="bee-title">⏱️ TIME RESULTS</div><div></div></div><div class="bee-main"><div class="bee-card bee-result"><div style="font-size:58px">${correct===total?'🏆':'🐝'}</div><div class="eyebrow">${correct===total?'PERFECT TIME RUN!':'GREAT JOB!'}</div><h2 style="margin-top:5px">FINAL RESULTS</h2><div class="score-pop">${activity.score}</div><div class="muted">SCORE</div><div class="stats-grid" style="margin-top:15px"><div class="card stat"><div class="label">Accuracy</div><div class="value">${acc}%</div></div><div class="card stat"><div class="label">Correct</div><div class="value">${correct}/${total}</div></div><div class="card stat"><div class="label">Best Streak</div><div class="value">🔥 ${activity.bestStreak}</div></div></div>${missed.length?`<div class="info-box" style="text-align:left;margin-top:15px"><strong>WORDS TO REVIEW</strong>${missed.map(x=>`<div style="padding:8px 0;font-weight:900;border-bottom:1px solid var(--line)">${x}</div>`).join('')}</div>`:`<div class="info-box" style="margin-top:15px"><strong>WORDS TO REVIEW</strong><p>None — clean sweep.</p></div>`}<div style="display:grid;gap:9px;margin-top:15px"><button class="btn btn-primary btn-full" onclick="go('home')">BACK TO HOME</button><button class="btn btn-outline btn-full" onclick="go('practice')">TRY TIME MODE AGAIN</button></div></div></div></div></div>`}
function saveTimeModeSession(){if(!activity||activity.mode!=='bee')return;stopTimer();stopBeeMusic();if(window.__beeCountdownTimer){clearInterval(window.__beeCountdownTimer);window.__beeCountdownTimer=null}if(window.__beeRoundAdvanceTimer){clearTimeout(window.__beeRoundAdvanceTimer);window.__beeRoundAdvanceTimer=null}if(window.speechSynthesis)speechSynthesis.cancel();state.savedSessions=state.savedSessions||{};state.savedSessions.bee={words:[...(activity.words||[])],index:activity.index||0,label:'Time Mode',mode:'bee',difficulty:((activity.beeDifficulties||[]).length===1?(activity.beeDifficulties||[])[0]:'mixed'),difficulties:[...(activity.beeDifficulties||[])],length:activity.beeLength||activity.words.length,rounds:[...(activity.rounds||[])],score:activity.score||0,streak:activity.streak||0,bestStreak:activity.bestStreak||0,startedAt:activity.startedAt||Date.now(),savedAt:Date.now()};saveState();toast('Practice Saved');activity=null;go('home')}
function resumeTimeModeSession(){const saved=(state.savedSessions||{}).bee;if(!saved){toast('No saved practice found.');return}const wds=[...(saved.words||[])];if(!wds.length){toast('Saved practice is unavailable.');return}activity={words:wds,index:Math.max(0,Math.min(Number(saved.index)||0,wds.length-1)),score:Number(saved.score)||0,streak:Number(saved.streak)||0,bestStreak:Number(saved.bestStreak)||0,rounds:saved.rounds||[],hints:0,mode:'bee',beeLength:Number(saved.length)||wds.length,beeDifficulties:saved.difficulties||[],startedAt:saved.startedAt||Date.now(),timeLeft:30,wordPlays:0,examplePlayed:false,definitionPlayed:false,submitted:false,transitioning:false};state.savedSessions.bee=null;saveState();showCountdown(()=>renderBeeRound())}
function confirmBeeExit(){saveTimeModeSession()}
function progressHTML(){const l=levelInfo();return `<main class="shell"><div class="topbar"><div><div class="eyebrow">YOUR PROFILE</div><h1>PROFILE</h1></div></div><div class="card profile-card"><div class="avatar">🐝</div><div style="flex:1"><div class="eyebrow">LEVEL ${l.idx+1}</div><h2>${l.name}</h2><p class="muted small" style="margin-top:4px">${l.achievements} of ${l.totalAchievements} achievements${l.isMaxLevel?' · ALL ACHIEVEMENTS':l.toNext?' · '+l.toNext+' '+(l.toNext===1?'achievement':'achievements')+' to '+LEVELS[l.idx+1][0].toUpperCase():' · MAX LEVEL'}</p></div></div><div class="segment" id="progressTabs" style="margin-top:15px"><button class="active" onclick="renderProgressTab('overview',this)">OVERVIEW</button><button onclick="renderProgressTab('achievements',this)">ACHIEVEMENTS</button><button onclick="renderProgressTab('history',this)">HISTORY</button></div><div id="progressContent" style="margin-top:15px">${overviewTab()}</div><section class="section"><div class="card smart-card"><div class="eyebrow">DATA</div><h3 style="margin:5px 0">Reset progress</h3><p class="muted small">This erases your practice data, streaks, achievements, daily goals and history.</p><button class="btn btn-danger btn-full" style="margin-top:12px" onclick="confirmReset()">RESET PROGRESS</button></div></section></main>`}
function renderProgressTab(tab,btn){document.querySelectorAll('#progressTabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('progressContent').innerHTML=tab==='overview'?overviewTab():tab==='achievements'?achievementsTab():historyTab()}
function overviewTab(){const l=levelInfo();return `<div class="dashboard-grid"><div class="card level-card"><div class="eyebrow">LEVEL ${l.idx+1}</div><div class="level-name">${l.name}</div><div style="font-weight:800;margin-bottom:8px">${l.achievements} / ${l.totalAchievements} ACHIEVEMENTS</div><div class="progress"><span style="width:${l.progress}%"></span></div><div class="small" style="margin-top:8px;color:#D7EBFF">${l.isMaxLevel?'ALL ACHIEVEMENTS UNLOCKED':l.toNext?l.toNext+' '+(l.toNext===1?'achievement':'achievements')+' to '+LEVELS[l.idx+1][0].toUpperCase():'MAX LEVEL'}</div></div><div class="card metric-card"><div class="label">Overall Accuracy</div><div class="metric-value">${overallAccuracy()}%</div><p class="muted small">${state.totalCorrect} correct / ${state.totalAnswers} attempts</p></div></div><section class="section"><div class="stats-grid">${[['Current Streak','🔥 '+state.dailyStreak],['Best Streak',state.bestStreak],['Words Practiced',state.wordsPracticed.size],['Best Bee Score',state.personalBests.beeScore||'—']].map(x=>`<div class="card stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">MASTERY</div><h2>All 90 words</h2></div></div><div class="card smart-card progress-list">${['easy','medium','hard'].map(d=>`<div class="progress-row"><div class="top"><span>${d.toUpperCase()}</span><span>${masteredCount(d)} / 30 MASTERED</span></div><div class="progress ${d==='medium'?'blue-progress':''}"><span style="width:${masteredCount(d)/30*100}%"></span></div></div>`).join('')}</div></section>`}
function wordsTab(){return `<div class="filter-wrap" id="wordFilters">${['ALL','EASY','MEDIUM','HARD','NEW','LEARNING','FAMILIAR','MASTERED','NEEDS PRACTICE'].map((f,i)=>`<button class="btn btn-small ${i===0?'btn-primary':'btn-outline'}" onclick="filterWords('${f}',this)">${f}</button>`).join('')}</div><div id="wordList" class="word-list">${wordItems(WORDS)}</div>`}
function filterWords(f,btn){document.querySelectorAll('#wordFilters .btn').forEach(b=>{b.className='btn btn-small btn-outline'});btn.className='btn btn-small btn-primary';let list=WORDS;if(['EASY','MEDIUM','HARD'].includes(f))list=WORDS.filter(w=>w.difficulty===f.toLowerCase());if(['NEW','LEARNING','FAMILIAR','MASTERED'].includes(f))list=WORDS.filter(w=>statsFor(w.word).masteryLevel===f);if(f==='NEEDS PRACTICE')list=WORDS.filter(w=>statsFor(w.word).attempts>0&&statsFor(w.word).accuracy<85);document.getElementById('wordList').innerHTML=wordItems(list)}
function wordItems(list){if(!list.length)return '<div class="card empty"><div class="big">🐝</div><h3>No words here yet.</h3><p class="muted" style="margin-top:5px">Keep practicing and this space will update.</p></div>';return list.map(w=>{const s=statsFor(w.word);const mastered=s.masteryLevel==='MASTERED';const seals=[['✏️',s.writeCorrect,'Type It!',''],['🔀',s.unscrambleCorrect,'Unscramble',''],['🔤',s.writeSpellCorrect,'Reverse Mode',''],['⏱️',s.timeCorrect,'Time Mode','time']];return `<div class="card word-item"><div class="word-item-main"><div class="word-item-head"><div class="word-item-word">${escapeHTML(w.word)}${mastered?'<span class="word-mastered-star" title="Mastered">⭐</span>':''}</div><button class="word-item-audio" onclick="speakWord('${jsq(w.word)}')" aria-label="Listen to ${escapeHTML(w.word)}" title="Listen to pronunciation">🔊</button></div><div class="word-item-translation">${escapeHTML(w.translation||'')}</div><div class="word-item-meta"><span class="pill difficulty ${w.difficulty}">${w.difficulty}</span><span class="accuracy">${s.masteryLevel}</span><span class="accuracy">${s.attempts} attempts</span></div></div><div class="word-mode-badges" aria-label="Activity badges">${seals.map(([icon,done,title,extra])=>`<span class="word-mode-badge ${done?'done':''} ${extra}" title="${title}${done?' · completed':''}">${icon}</span>`).join('')}</div></div>`}).join('')}
function wordListPageHTML(){return `<main class="shell"><div class="topbar"><div><div class="eyebrow">OFFICIAL WORD LIST</div><h1>WORD LIST</h1><p class="muted small">90 competition words · Track your mastery.</p></div></div><section class="section">${wordsTab()}</section></main>`}

function achievementsTab(){return `<div class="achievement-grid">${ACHIEVEMENTS.map(a=>{const unlocked=state.unlocked.includes(a.id);return `<div class="card achievement ${unlocked?'':'locked'}"><div class="badge">${unlocked?a.icon:'🔒'}</div><div class="achievement-title">${a.title}</div><p>${a.desc}</p><div class="ach-progress"><span class="pill">${unlocked?'UNLOCKED':'LOCKED'}</span></div></div>`}).join('')}</div>`}
function historyTab(){if(!state.history.length)return '<div class="card empty"><div class="big">📈</div><h3>Your history starts here.</h3><p class="muted" style="margin-top:5px">Complete a practice session to see meaningful progress.</p></div>';return `<div class="history">${state.history.slice(0,30).map(h=>`<div class="card history-item"><div><div class="eyebrow">${escapeHTML(h.date)}</div><h3 style="margin-top:4px">${escapeHTML(h.mode)}</h3><p class="muted small" style="margin-top:3px">${h.words} words · ${h.accuracy}% accuracy${h.mode==='Time Mode'?' · Score '+h.score:''}</p></div></div>`).join('')}</div>`}
function confirmReset(){openModal('<h3>ARE YOU SURE?</h3><p>This will erase all your practice data, including mastery, streaks, achievements, daily goals and history.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-danger" onclick="resetProgress()">RESET</button></div>')}
function resetProgress(){localStorage.removeItem(STORAGE_KEY);state=clone(defaultState);state.wordsPracticed=new Set();initDaily();closeModal();go('home');toast('Progress reset. Fresh start!')}
function openModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('overlay').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),1900)}
function confetti(n=20){const c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<n;i++){const x=document.createElement('i');x.style.left=(Math.random()*100)+'%';x.style.top=(-10-Math.random()*20)+'px';x.style.background=['#FFD600','#087FF5','#FF9800','#22C55E','#FFFFFF'][i%5];x.style.transform='rotate('+Math.random()*360+'deg)';x.style.animationDelay=(Math.random()*.2)+'s';c.appendChild(x)}setTimeout(()=>c.innerHTML='',1600)}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function boot(){initDaily();WORDS.forEach(refreshMastery);saveState();renderScreen('home');ensureAchievements()}
boot();
</script>
