1"><h3>${smart?smart+' words ready to review':'Smart Review is locked'}</h3><p class="muted small" style="margin-top:4px">${smart?'Practice the words that need the most attention.':'Practice some words first. Smart Review will unlock when there are words to revisit.'}</p></div>${smart?`<button class="btn btn-primary btn-small" onclick="startActivity('smart')">START REVIEW</button>`:''}</div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">OVERVIEW</div><h2>Your stats</h2></div></div><div class="stats-grid">${[['Words Practiced',state.wordsPracticed.size],['Mastered',mastered],['Accuracy',acc+'%'],['Current Streak','🔥 '+state.dailyStreak],['Best Streak',state.bestStreak],['XP',state.xp]].map(x=>`<div class="card stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">ACHIEVEMENTS</div><h2>Your badges</h2></div></div><div class="achievement-grid">${ACHIEVEMENTS.slice(0,3).map(a=>{const u=unlocked.includes(a.id);return `<div class="card achievement ${u?'':'locked'}"><div class="badge">${u?a.icon:'🔒'}</div><div class="achievement-title">${a.title}</div><p>${a.desc}</p></div>`}).join('')}</div><p class="muted small" style="margin-top:9px">${unlocked.length} of ${ACHIEVEMENTS.length} unlocked</p></section><section class="section"><div class="section-head"><div><div class="eyebrow">TODAY'S GOALS</div><h2>Small wins, every day</h2></div></div><div class="goals">${goals.map(g=>`<div class="goal ${g.value>=g.target?'done':''}"><div class="check">${g.value>=g.target?'✓':''}</div><div class="goal-text">${g.label}</div><div class="goal-count">${g.value} / ${g.target}</div></div>`).join('')}</div></section></main>`}
function diffCard(d){const c=masteredCount(d);const accs=difficultyWords(d).reduce((a,w)=>{const s=statsFor(w.word);return [a[0]+s.attempts,a[1]+s.correctAttempts]},[0,0]);const acc=accs[0]?Math.round(accs[1]/accs[0]*100):0;return `<div class="card diff-card ${d}"><div class="diff-title"><span class="pill difficulty ${d}">${d.toUpperCase()}</span><span class="small muted">30 WORDS</span></div><div class="big">${c}/30</div><div class="mini-row"><span>mastered</span><strong>${acc}% accuracy</strong></div><div class="progress"><span style="width:${c/30*100}%"></span></div><button class="btn ${d==='easy'?'btn-yellow':d==='medium'?'btn-primary':'btn-orange'} btn-full btn-small" style="margin-top:12px" onclick="practiceDifficulty='${d}';go('practice')">PRACTICE ${d.toUpperCase()}</button></div>`}
function practiceHTML(){return `<main class="shell practice-shell"><div class="topbar practice-topbar"><div><div class="eyebrow">TRAINING HUB</div><h1>PRACTICE</h1></div></div><section class="section"><div class="section-head"><div><div class="eyebrow">TRAINING MODES</div><h2>Choose how to practice</h2></div></div><div class="practice-grid">${[['spell','✍️','LISTEN & WRITE','Listen to the word and write the spelling.'],['listen','🔤','LISTEN & SPELL','Listen first. Spell under competition-style pressure.'],['bee','🐝','BEE','A 10-round competition simulation.']].map(m=>modeCard(...m)).join('')}</div></section></main>`}
function difficultyColorAt(value){const stops=[[34,197,94],[255,214,0],[239,68,68]];const v=Math.max(0,Math.min(2,Number(value)||0));const i=Math.min(1,Math.floor(v));const t=v-i;const a=stops[i],b=stops[i+1];const c=a.map((n,k)=>Math.round(n+(b[k]-n)*t));return `rgb(${c[0]} ${c[1]} ${c[2]})`;}
function difficultyIndex(d){return d==='hard'?2:d==='medium'?1:0}
function applyDifficultyPickerVisual(value){const shell=document.querySelector('.difficulty-picker-shell');if(!shell)return;const v=Math.max(0,Math.min(2,Number(value)||0));const levels=['easy','medium','hard'];shell.style.setProperty('--difficulty-bg',difficultyColorAt(v));shell.dataset.sliderValue=v;const slider=shell.querySelector('.difficulty-picker-range');const label=shell.querySelector('.difficulty-picker-label');if(slider)slider.value=v;if(label)label.textContent=levels[Math.round(v)].toUpperCase();renderDifficultyBackground(v);}
function renderDifficultyBackground(value){const shell=document.querySelector('.difficulty-picker-shell');if(!shell)return;let layer=shell.querySelector('.difficulty-bg-effects');if(!layer){layer=document.createElement('div');layer.className='difficulty-bg-effects';shell.prepend(layer);}const v=Math.max(0,Math.min(2,Number(value)||0));const counts=[8,15,24];const emojis=v<.34?['✨','🧠','💡']:v<1.34?['🧠','💦','😵‍💫','⚡']:['🧠','💦','🤯','😵‍💫','⚡','🔥'];const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const count=counts[Math.round(v)];const items=[];for(let i=0;i<count;i++){const isEmoji=(i%3===0)||v>1.5&&i%2===0;const text=isEmoji?emojis[Math.floor(Math.random()*emojis.length)]:letters[Math.floor(Math.random()*letters.length)];const size=isEmoji?(18+Math.random()*20):(20+Math.random()*34);items.push(`<span class="difficulty-bg-float" style="--x:${5+Math.random()*90}%;--y:${8+Math.random()*84}%;--size:${size}px;--rot:${-25+Math.random()*50}deg;--dur:${.65+Math.random()*.5}s;--delay:${Math.random()*.28}s;--peak:${.10+v*.08}">${text}</span>`);}layer.innerHTML=items.join('');}
function setPickerDifficulty(value,dragging=true){const levels=['easy','medium','hard'];const v=Math.max(0,Math.min(2,Number(value)||0));const shell=document.querySelector('.difficulty-picker-shell');if(shell){shell.classList.remove('slider-moving');void shell.offsetWidth;shell.classList.add('slider-moving');clearTimeout(window.__difficultySquashTimer);window.__difficultySquashTimer=setTimeout(()=>shell.classList.remove('slider-moving'),430)}practiceDifficulty=levels[Math.round(v)];applyDifficultyPickerVisual(v);if(!dragging)snapPickerDifficulty(v);}
function snapPickerDifficulty(value){const snapped=Math.max(0,Math.min(2,Math.round(Number(value)||0)));const levels=['easy','medium','hard'];practiceDifficulty=levels[snapped];const shell=document.querySelector('.difficulty-picker-shell');if(!shell)return;const slider=shell.querySelector('.difficulty-picker-range');if(slider)slider.value=snapped;applyDifficultyPickerVisual(snapped);shell.classList.remove('easy','medium','hard');shell.classList.add(levels[snapped]);}
function choosePracticeDifficulty(mode){pendingPracticeMode=mode;practiceDifficulty=practiceDifficulty||'easy';currentScreen='difficulty-picker';const app=document.getElementById('app');const value=difficultyIndex(practiceDifficulty);const modeName=modeLabel(mode);app.innerHTML=`<main class="shell difficulty-picker-shell ${practiceDifficulty}" style="--difficulty-bg:${difficultyColorAt(value)}"><div class="activity-top"><button class="icon-nav" onclick="go('practice')" aria-label="Back to Practice" title="Back to Practice">←</button><div><div class="mode-title">${escapeHTML(modeName)}</div><div class="mode-sub">Choose your difficulty</div></div></div><section class="difficulty-picker-card"><div class="difficulty-picker-copy"><div class="eyebrow">STEP 1 · DIFFICULTY</div><h1>How challenging?</h1></div><div class="difficulty-picker-level"><div class="difficulty-picker-label">${practiceDifficulty.toUpperCase()}</div><div class="difficulty-picker-track"><input class="difficulty-picker-range" type="range" min="0" max="2" step="0.01" value="${value}" aria-label="Difficulty level" oninput="setPickerDifficulty(this.value,true)" onpointerup="snapPickerDifficulty(this.value)" onchange="snapPickerDifficulty(this.value)" onkeyup="snapPickerDifficulty(this.value)"><div class="difficulty-picker-dots" aria-hidden="true"><span></span><span></span><span></span></div></div><div class="difficulty-picker-scale"><span>EASY</span><span>MEDIUM</span><span>HARD</span></div></div><button class="btn btn-primary btn-full difficulty-start" onclick="beginSelectedPractice()">START ${escapeHTML(modeName).toUpperCase()} →</button></section></main>`;renderNav();applyDifficultyPickerVisual(value);window.scrollTo({top:0,behavior:'smooth'})}
function beginSelectedPractice(){const mode=pendingPracticeMode;if(!mode)return;pendingPracticeMode=null;const label=practiceDifficulty.toUpperCase()+' · '+modeLabel(mode);launchPractice(shuffle(difficultyWords(practiceDifficulty)).slice(0,30),mode,label)}
function modeCard(id,icon,title,desc){const needsDifficulty=['spell','listen'].includes(id);const actionMode=id==='bee'?'go(\'bee\')':null;const smartUnavailable=id==='smart'&&smartCount()===0;if(smartUnavailable)return `<div class="card mode-card mode-disabled"><div class="mode-icon">${icon}</div><h3>${title}</h3><p>No words to review yet. Practice some words first and this mode will unlock.</p><div class="mode-footer"><button class="btn btn-small mode-disabled-btn" disabled aria-label="Smart Review locked">LOCKED</button></div></div>`;const action=actionMode||(needsDifficulty?`choosePracticeDifficulty('${id}')`:`startActivity('${id}')`);return `<div class="card mode-card"><div class="mode-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><div class="mode-footer"><button class="btn btn-primary btn-small" onclick="${action}">START</button></div></div>`}
function startActivity(mode){initDaily();if(mode==='wordlist'){renderPracticeWordList();return}if(mode==='smart'){const list=smartWords().slice(0,10);if(!list.length){toast('Smart Review unlocks when you have words to review.');return}launchPractice(list,'smart','Smart Review');return}launchPractice(shuffle(difficultyWords(practiceDifficulty)).slice(0,30),mode,practiceDifficulty.toUpperCase()+' · '+modeLabel(mode))}
function renderPracticeWordList(){currentScreen='practice-wordlist';const app=document.getElementById('app');app.innerHTML=`<main class="shell"><div class="activity-top"><button class="icon-nav" onclick="go('practice')" aria-label="Back to Practice" title="Back to Practice">←</button><div><div class="mode-title">WORD LIST</div><div class="mode-sub">Official Spelling Bee words · 90 words</div></div></div><div style="margin-top:14px">${wordsTab()}</div></main>`;renderNav();window.scrollTo({top:0,behavior:'smooth'})}
function modeLabel(m){return m==='spell'?'Listen & Write':m==='listen'?'Listen & Spell':'Practice'}
function launchPractice(words,mode,label){practiceDay();saveState();if(!words.length){toast('No words available yet.');return}activeActivity=mode;activity={words:words.map(w=>w.word),index:0,label,answers:[],hints:0,startedAt:Date.now(),mode,difficulty:(mode==='spell'||mode==='listen')?practiceDifficulty:(words[0]?.difficulty||practiceDifficulty)};state.currentSession={words:activity.words,index:0,label,mode,difficulty:activity.difficulty};saveState();renderActivity()}
function resumeSession(){const s=state.currentSession;if(!s){go('practice');return}activeActivity=s.mode;activity={words:s.words,index:s.index,label:s.label,answers:s.answers||[],hints:s.hints||0,startedAt:s.startedAt||Date.now(),mode:s.mode,difficulty:s.difficulty||s.words.map(getWord).find(Boolean)?.difficulty||'easy'};renderActivity()}
function savePracticeSession(){if(!activity||!['spell','listen'].includes(activity.mode))return;const key=activity.mode;state.savedSessions=state.savedSessions||{spell:null,listen:null};state.savedSessions[key]={words:[...activity.words],index:activity.index,label:activity.label,mode:activity.mode,difficulty:activity.difficulty,answers:[...(activity.answers||[])],hints:activity.hints||0,startedAt:activity.startedAt||Date.now(),savedAt:Date.now()};state.currentSession=null;saveState();toast('Practice saved.');go('home')}
function resumeSavedSession(mode){const s=(state.savedSessions||{})[mode];if(!s){toast('No saved practice found.');return}activeActivity=s.mode;activity={words:s.words,index:s.index,label:s.label,answers:s.answers||[],hints:s.hints||0,startedAt:s.startedAt||Date.now(),mode:s.mode,difficulty:s.difficulty||'easy'};state.currentSession=null;saveState();renderActivity()}
function clearSavedSession(mode){if(state.savedSessions)state.savedSessions[mode]=null;saveState()}
function renderActivity(){currentScreen='activity';const app=document.getElementById('app');const w=getWord(activity.words[activity.index]);const modeName=activity.mode==='learn'?'Learn':activity.mode==='spell'?'Listen & Write':'Listen & Spell';const pct=Math.round((activity.index/Math.max(1,activity.words.length-1))*100);const activityDiff=activity.difficulty||w.difficulty||'easy';const diffClass=activityDiff;const diffBg=difficultyColorAt(difficultyIndex(activityDiff));app.innerHTML=`<main class="shell activity-shell ${diffClass}" style="--practice-bg:${diffBg}"><div class="activity-top"><button class="icon-nav" onclick="confirmExit()" aria-label="Leave practice" title="Leave practice">←</button><div><div class="mode-title">${modeName}</div><div class="mode-sub">${escapeHTML(w.difficulty.toUpperCase())} · Word ${activity.index+1} of ${activity.words.length}</div></div></div><div class="activity-progress"><span style="width:${pct}%"></span></div>${activity.mode==='learn'?learnCard():spellCard(activity.mode==='listen')}</main>`;renderNav();window.scrollTo({top:0,behavior:'smooth'});if(activity.mode!=='learn')setTimeout(()=>document.getElementById('spellInput')?.focus(),150)}
function learnCard(){const w=getWord(activity.words[activity.index]);return `<div class="learning-sheet"><div class="word-hero"><div class="word">${escapeHTML(w.word)}</div><div class="pronunciation">${escapeHTML(w.pronunciation)}</div><button class="audio-circle" aria-label="Play pronunciation" title="Play pronunciation" onclick="speakWord('${jsq(w.word)}')">🔊</button></div><div class="definition-row"><p>${escapeHTML(w.definition)}</p><div class="translation"><strong>Translation</strong><span>${escapeHTML(w.translation)}</span></div></div><div class="examples-clean"><div class="examples-title">Examples</div>${w.examples.map((e,i)=>`<div class="example-clean"><b>${i+1}</b><span>${escapeHTML(e)}</span></div>`).join('')}</div><div class="learn-footer"><div class="learn-status" aria-label="Review actions"><button class="learn-mark review" aria-label="Needs practice" title="Needs practice" onclick="markLearn('needs')">↻</button><button class="learn-mark known" aria-label="I know it" title="I know it" onclick="markLearn('known')">✓</button></div><div class="word-stepper"><button class="step-arrow" ${activity.index===0?'disabled':''} aria-label="Previous word" title="Previous word" onclick="previousActivity()">←</button><button class="step-arrow next-arrow" aria-label="Next word" title="Next word" onclick="nextActivity()">→</button></div></div></div>`}
function toggleExamples(){document.getElementById('examples')?.classList.toggle('hidden')}
function markLearn(type){const w=getWord(activity.words[activity.index]);if(type==='known')toast('⭐ Marked for review confidence');else toast('🔁 Added to your review focus');nextActivity()}
function spellCard(listen=false){const w=getWord(activity.words[activity.index]);if(!listen)return `<section class="spelling-sheet listen-write-sheet"><div class="write-head"><div class="spell-prompt-copy"><div class="prompt-title">Listen & write</div><div class="audio-hint">Listen carefully, then type the spelling.</div></div><button class="write-audio" onclick="speakWord('${jsq(w.word)}')" aria-label="Play word pronunciation" title="Play word pronunciation">🔊</button></div><div class="input-wrap"><label class="eyebrow" for="spellInput">YOUR SPELLING</label><div class="input-action-row"><input id="spellInput" class="spell-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type the spelling…" onkeydown="if(event.key==='Enter')checkSpelling()" /><button class="icon-submit" onclick="checkSpelling()" aria-label="Check spelling" title="Check spelling">✓</button></div></div><div class="listen-support"><span class="context-label">Optional clues</span><div class="support-actions"><button class="support-btn" onclick="toggleListenSupport('definition')" aria-label="Show definition" title="Show definition">📖</button><button class="support-btn" onclick="toggleListenSupport('translation')" aria-label="Show translation" title="Show translation">🌐</button><button class="support-btn" onclick="speakExample('${jsq(w.examples[0])}')" aria-label="Hear example sentence" title="Hear example sentence">💬</button></div></div><div class="listen-clues"><div id="listenDefinition" class="listen-clue hidden"><span class="context-label">Definition</span><p>${escapeHTML(w.definition)}</p></div><div id="listenTranslation" class="listen-clue hidden"><span class="context-label">Translation</span><p>${escapeHTML(w.translation)}</p></div></div><div id="feedback"></div></section>`;return `<section class="spelling-sheet listen-spell-sheet"><div class="listen-spell-heading"><div class="prompt-title">Listen & spell</div></div>${voicePanel(w)}<div class="listen-support"><span class="context-label">Optional clues</span><div class="support-actions"><button class="support-btn" onclick="toggleListenSupport('definition')" aria-label="Show definition" title="Show definition">📖</button><button class="support-btn" onclick="toggleListenSupport('translation')" aria-label="Show translation" title="Show translation">🌐</button><button class="support-btn" onclick="speakExample('${jsq(w.examples[0])}')" aria-label="Hear example sentence" title="Hear example sentence">💬</button></div></div><div class="listen-clues"><div id="listenDefinition" class="listen-clue hidden"><span class="context-label">Definition</span><p>${escapeHTML(w.definition)}</p></div><div id="listenTranslation" class="listen-clue hidden"><span class="context-label">Translation</span><p>${escapeHTML(w.translation)}</p></div></div><div id="feedback"></div></section>`}
function toggleListenSupport(type){const id=type==='definition'?'listenDefinition':'listenTranslation';document.getElementById(id)?.classList.toggle('hidden')}
function speakExample(text){if(!('speechSynthesis' in window)){toast('Audio is unavailable.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=.98;const voices=speechSynthesis.getVoices();const v=voices.filter(v=>/^en-US/i.test(v.lang)).sort((a,b)=>{const score=v=>/(natural|online|enhanced|google|samantha|ava|aria|jenny)/i.test(v.name)?1:0;return score(b)-score(a)})[0];if(v)u.voice=v;speechSynthesis.speak(u)}
function voicePanel(w){const pattern=(w.word||'').toUpperCase().replace(/[^A-Z-]/g,'');const slots=pattern.split('').map((ch,i)=>ch==='-'?`<span class="hangman-hyphen" data-slot="${i}">-</span>`:`<span class="hangman-slot" data-slot="${i}"><span class="hangman-letter"></span><span class="hangman-line">_</span></span>`).join('');return `<div class="voice-panel"><div class="voice-head"><div><div class="voice-title"><span>🎙</span><span>Spell with your voice</span></div><p class="muted small">Tap record, then say each letter one at a time.</p></div><button class="voice-main-audio" onclick="speakWord('${jsq(w.word)}')" aria-label="Play word pronunciation" title="Play word pronunciation">🔊</button></div><div class="voice-actions"><button id="recordBtn" class="voice-icon-btn voice-record" onclick="startVoice()" aria-label="Record spelling" title="Record spelling"><span>●</span></button><button class="voice-use-btn" onclick="processVoiceAnswer()" aria-label="Check spelling" title="Check spelling"><span>✓</span></button><button class="voice-icon-btn voice-replay" onclick="resetVoice()" aria-label="Start again" title="Start again"><span>↻</span></button></div><div class="voice-labels"><span>RECORD</span><span>CHECK</span><span>START AGAIN</span></div><div id="transcript" class="transcript" aria-live="polite"><div id="transcriptLetters" class="transcript-letters hangman-display" data-word-length="${pattern.replace(/-/g,'').length}">${slots}</div></div><div id="voiceStatus" class="small muted" style="margin-top:8px"></div></div>`}
function supportsVoice(){return 'webkitSpeechRecognition' in window||'SpeechRecognition' in window}
function startVoice(){
 if(!state.settings.voice){toast('Voice recognition is turned off in Profile.');return}
 if(!supportsVoice()){toast("Voice spelling isn't supported in this browser.");return}
 if(recognitionActive){stopVoice();return}
 const C=window.SpeechRecognition||window.webkitSpeechRecognition;
 voiceRecognition=new C();
 voiceRecognition.lang='en-US';
 voiceRecognition.continuous=true;
 voiceRecognition.interimResults=true;
 voiceRecognition.maxAlternatives=3;
 // Keep interim recognition as the primary low-latency signal so letters can
 // appear while the student is still spelling instead of waiting for a final result.
 voiceRecognition.interimResults=true;
 recognitionActive=true;
 window.voiceLetters='';
 window.voiceLastResultIndex=0;
 const status=document.getElementById('voiceStatus'), transcript=document.getElementById('transcript'), lettersEl=document.getElementById('transcriptLetters'), record=document.getElementById('recordBtn'), sheet=document.querySelector('.listen-spell-sheet'), panel=document.querySelector('.voice-panel');
 if(status)status.innerHTML='<span class="record-dot"></span> Listening… say the letters clearly';
 if(record){record.classList.add('recording');record.setAttribute('aria-label','Stop recording');record.title='Stop recording'}
 if(sheet)sheet.classList.add('recording-mode');
 if(panel)panel.classList.add('recording-active');
 voiceRecognition.onresult=e=>{
   const target=(getWord(activity.words[activity.index])?.word||'').toUpperCase().replace(/[^A-Z-]/g,'');
   let allTokens=[];
   for(let i=0;i<e.results.length;i++){
     const result=e.results[i];
     const alts=[];
     for(let j=0;j<result.length;j++)alts.push(result[j].transcript);
     allTokens.push({text:alts[0]||'',alts,final:result.isFinal});
   }
   const parsed=parseSpokenLetterSequence(allTokens,target);
   // SpeechRecognition interim results are unstable: while the student pauses,
   // the browser may temporarily rewrite an earlier chunk or return a shorter
   // hypothesis. Never let that transient hypothesis erase letters already
   // shown. The live spelling is therefore monotonic during one recording: it
   // can only grow until the student taps START AGAIN.
   const current=window.voiceLetters||'';
   const candidate=parsed.letters||'';
   if(candidate.length>current.length && candidate.startsWith(current)){
     window.voiceLetters=candidate;
     if(lettersEl){
       const slots=lettersEl.querySelectorAll('.hangman-slot');
       for(let i=current.length;i<candidate.length;i++){
         const slot=slots[i];
         const el=slot?.querySelector('.hangman-letter');
         if(el){
           el.textContent=candidate[i];
           slot.classList.add('filled');
         }
       }
     }
   }
   if(status && recognitionActive)status.innerHTML='<span class="record-dot"></span> Listening…';
 };
 voiceRecognition.onerror=e=>{
   if(status)status.textContent=e.error==='not-allowed'?'Microphone permission is blocked.': 'Voice recognition error. Try again.';
   recognitionActive=false;setVoiceRecordingUI(false);
 };
 voiceRecognition.onend=()=>{
   recognitionActive=false;
   if(status)status.textContent=window.voiceLetters?'Ready to check.':'Ready — tap record to try again.';
   setVoiceRecordingUI(false);
 };

function letterCandidates(token){

  b:['B'],be:['B'],bee:['B'],bea:['B'],

  d:['D'],dee:['D'],
  e:['E'],ee:['E'],
  f:['F'],ef:['F'],eff:['F'],
  g:['G'],gee:['G'],
  h:['H'],aitch:['H'],
  i:['I'],eye:['I'],aye:['I'],
  j:['J'],jay:['J'],
  k:['K'],kay:['K'],
  l:['L'],el:['L'],ell:['L'],
  m:['M'],em:['M'],emm:['M'],mmm:['M'],am:['M'],
  n:['N'],en:['N'],enn:['N'],
  o:['O'],oh:['O'],owe:['O'],
  p:['P'],pee:['P'],pea:['P'],
  q:['Q'],cue:['Q'],queue:['Q'],
  r:['R'],are:['R'],ar:['R'],
  s:['S'],ess:['S'],
  t:['T'],tee:['T'],
  u:['U'],you:['U'],
  v:['V'],vee:['V'],
  w:['W'],doubleyou:['W'],
  x:['X'],ex:['X'],
  y:['Y'],why:['Y'],
  z:['Z'],zee:['Z'],zed:['Z'],
  hyphen:['-'],hyphens:['-'],hyphenated:['-'],hyphenate:['-'],hyphened:['-'],

 // transcript from an earlier pause cannot be treated as new letters.
 if(/^m+$/i.test(raw))return ['M'];
 if(/^n+$/i.test(raw))return ['N'];

function parseSpokenLetterSequence(results,target){
 // Hyphens are structural in the word, not something the student needs to
 // pronounce. Remove them from the recognition target so the next spoken
 // letter is always matched against the next actual letter of the word.
 const pattern=(target||'').toUpperCase().replace(/[^A-Z]/g,'');
 let letters='';
 const ambiguous={
  P:['B'], B:['P','V'], M:['N'], N:['M'],
  E:['I'], I:['E','A'], F:['S'], S:['F'],
  A:['I'], V:['B']
 };
 for(const item of (results||[])){
   if(letters.length>=pattern.length)break;
   const alts=Array.isArray(item.alts)&&item.alts.length?item.alts:[item.text||''];
   const candidateStreams=[];
   alts.forEach((text,rank)=>{
     let clean=String(text||'').toLowerCase();
     // Hyphens are already displayed in the UI. If the browser happens to
     // transcribe the word "hyphen", simply discard that token and continue.
     clean=clean.replace(/\b(?:hyphen(?:s|ated|ate|ed)?|dash|high\s*fen|highfen|highphen|hi\s*fen)\b/g,' ');
     clean=clean.replace(/\s+/g,' ').trim();
     const chunks=clean.split(/[\s,.;:!?-]+/).filter(Boolean);
     const cs=[];
     chunks.forEach(chunk=>letterCandidates(chunk).forEach(c=>{
       // '-' can never advance the spoken-letter sequence. It is a fixed
       // visual separator and is intentionally ignored by recognition.
       if(c!=='-')cs.push(c);
     }));
     if(cs.length)candidateStreams.push({letters:cs,rank});
   });
   let best=null;
   for(const stream of candidateStreams){
     let pos=letters.length;
     let accepted=0;
     for(const cand of stream.letters){
       if(pos>=pattern.length)break;
       const expected=pattern[pos];
       if(cand===expected || (ambiguous[expected]?.includes(cand))){
         pos++; accepted++;
       }else{
         // Ignore mismatches; a later token in this same utterance may still
         // correspond to the next expected letter.
         continue;
       }
     }
     if(!best || accepted>best.accepted || (accepted===best.accepted && stream.rank<best.rank)){
       best={accepted,stream};
     }
   }
   if(best?.accepted){
     for(const cand of best.stream.letters){
       if(letters.length>=pattern.length)break;
       const expected=pattern[letters.length];
       if(cand===expected || ambiguous[expected]?.includes(cand))letters+=expected;
     }
   }
 }

   activity.transitioning=false;
   if(activity.index>=9)finishBee();
   else{activity.index++;renderBeeRound();}
 },650);
}
function nextBeeRound(){if(activity.index>=9){finishBee();return}activity.index++;renderBeeRound()}
function finishBee(){stopTimer();stopBeeMusic();const correct=activity.rounds.filter(x=>x.correct).length;const acc=Math.round(correct/10*100);const missed=activity.rounds.filter(x=>!x.correct).map(x=>x.word);const s={date:today(),mode:'Bee Mode',difficulty:null,words:10,correct,accuracy:acc,score:activity.score,scoreCorrect:correct,bestStreak:activity.bestStreak,xp:activity.beeXP||0,completed:true,missed};state.history.unshift(s);state.history=state.history.slice(0,60);updateSessionGoals('bee');state.personalBests.beeScore=Math.max(state.personalBests.beeScore,activity.score);state.bestStreak=Math.max(state.bestStreak,activity.bestStreak);toast('Bee XP already awarded during the rounds.');ensureAchievements();saveState();document.getElementById('app').innerHTML=`<div class="bee-arena"><div class="bee-shell"><div class="bee-top"><div></div><div class="bee-title">🐝 BEE RESULTS</div><div></div></div><div class="bee-main"><div class="bee-card bee-result"><div style="font-size:58px">${correct===10?'🏆':'🐝'}</div><div class="eyebrow">${correct===10?'PERFECT BEE!':'GREAT JOB!'}</div><h2 style="margin-top:5px">FINAL RESULTS</h2><div class="score-pop">${activity.score}</div><div class="muted">SCORE</div><div class="stats-grid" style="margin-top:15px"><div class="card stat"><div class="label">Accuracy</div><div class="value">${acc}%</div></div><div class="card stat"><div class="label">Correct</div><div class="value">${correct}/10</div></div><div class="card stat"><div class="label">Best Streak</div><div class="value">🔥 ${activity.bestStreak}</div></div><div class="card stat"><div class="label">XP</div><div class="value">+${activity.beeXP||0}</div></div></div>${missed.length?`<div class="info-box" style="text-align:left;margin-top:15px"><strong>WORDS TO REVIEW</strong>${missed.map(x=>`<div style="padding:8px 0;font-weight:900;border-bottom:1px solid var(--line)">${x}</div>`).join('')}</div>`:`<div class="info-box" style="margin-top:15px"><strong>WORDS TO REVIEW</strong><p>None — clean sweep.</p></div>`}<div style="display:grid;gap:9px;margin-top:15px"><button class="btn btn-primary btn-full" onclick="go('home')">BACK TO HOME</button><button class="btn btn-outline btn-full" onclick="go('practice')">TRY BEE AGAIN</button></div></div></div></div></div>`}
function confirmBeeExit(){openModal('<h3>LEAVE BEE?</h3><p>Your completed rounds will be recorded, but this simulation will not count as a completed Bee until all 10 rounds are finished.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">CONTINUE</button><button class="btn btn-primary" onclick="closeModal();stopTimer();go(\'home\')">🏠 SAVE & LEAVE</button></div>')}
function progressHTML(){const l=levelInfo();return `<main class="shell"><div class="topbar"><div><div class="eyebrow">YOUR JOURNEY</div><h1>PROGRESS</h1></div><span class="pill">${state.xp} XP</span></div><div class="segment" id="progressTabs"><button class="active" onclick="renderProgressTab('overview',this)">OVERVIEW</button><button onclick="renderProgressTab('achievements',this)">ACHIEVEMENTS</button><button onclick="renderProgressTab('history',this)">HISTORY</button></div><div id="progressContent" style="margin-top:15px">${overviewTab()}</div></main>`}
function renderProgressTab(tab,btn){document.querySelectorAll('#progressTabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('progressContent').innerHTML=tab==='overview'?overviewTab():tab==='achievements'?achievementsTab():historyTab()}
function overviewTab(){const l=levelInfo();return `<div class="dashboard-grid"><div class="card level-card"><div class="eyebrow">LEVEL ${l.idx+1}</div><div class="level-name">${l.name}</div><div style="font-weight:800;margin-bottom:8px">${state.xp} / ${l.next||state.xp} XP</div><div class="progress"><span style="width:${l.progress}%"></span></div><div class="small" style="margin-top:8px;color:#D7EBFF">${l.toNext?l.toNext+' XP to the next level':'MAX LEVEL'}</div></div><div class="card metric-card"><div class="label">Overall Accuracy</div><div class="metric-value">${overallAccuracy()}%</div><p class="muted small">${state.totalCorrect} correct / ${state.totalAnswers} attempts</p></div></div><section class="section"><div class="stats-grid">${[['Current Streak','🔥 '+state.dailyStreak],['Best Streak',state.bestStreak],['Words Practiced',state.wordsPracticed.size],['Best Bee Score',state.personalBests.beeScore||'—']].map(x=>`<div class="card stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">MASTERY</div><h2>All 90 words</h2></div></div><div class="card smart-card progress-list">${['easy','medium','hard'].map(d=>`<div class="progress-row"><div class="top"><span>${d.toUpperCase()}</span><span>${masteredCount(d)} / 30 MASTERED</span></div><div class="progress ${d==='medium'?'blue-progress':''}"><span style="width:${masteredCount(d)/30*100}%"></span></div></div>`).join('')}</div></section>`}
function wordsTab(){return `<div class="filter-wrap" id="wordFilters">${['ALL','EASY','MEDIUM','HARD','NEW','LEARNING','FAMILIAR','MASTERED','NEEDS PRACTICE'].map((f,i)=>`<button class="btn btn-small ${i===0?'btn-primary':'btn-outline'}" onclick="filterWords('${f}',this)">${f}</button>`).join('')}</div><div id="wordList" class="word-list">${wordItems(WORDS)}</div>`}
function filterWords(f,btn){document.querySelectorAll('#wordFilters .btn').forEach(b=>{b.className='btn btn-small btn-outline'});btn.className='btn btn-small btn-primary';let list=WORDS;if(['EASY','MEDIUM','HARD'].includes(f))list=WORDS.filter(w=>w.difficulty===f.toLowerCase());if(['NEW','LEARNING','FAMILIAR','MASTERED'].includes(f))list=WORDS.filter(w=>statsFor(w.word).masteryLevel===f);if(f==='NEEDS PRACTICE')list=WORDS.filter(w=>statsFor(w.word).attempts>0&&statsFor(w.word).accuracy<85);document.getElementById('wordList').innerHTML=wordItems(list)}
function wordItems(list){if(!list.length)return '<div class="card empty"><div class="big">🐝</div><h3>No words here yet.</h3><p class="muted" style="margin-top:5px">Keep practicing and this space will update.</p></div>';return list.map(w=>{const s=statsFor(w.word);const dots=[s.writeCorrect,s.listenCorrect,s.beeCorrect];return `<div class="card word-item"><div class="mastery-dots" title="Listen & Write · Listen & Spell · Bee">${dots.map(x=>`<span class="mastery-progress-dot ${x?'filled':''}"></span>`).join('')}</div><div class="word-item-main"><div class="word-item-head"><div class="word-item-word">${escapeHTML(w.word)}</div><button class="word-item-audio" onclick="speakWord('${jsq(w.word)}')" aria-label="Listen to ${escapeHTML(w.word)}" title="Listen to pronunciation">🔊</button></div><div class="word-item-translation">${escapeHTML(w.translation||'')}</div><div class="word-item-meta"><span class="pill difficulty ${w.difficulty}">${w.difficulty}</span><span class="accuracy">${s.masteryLevel}</span><span class="accuracy">${s.attempts} attempts</span></div></div><button class="btn btn-primary btn-small" onclick="practiceOne('${jsq(w.word)}')">PRACTICE</button></div>`}).join('')}
function wordListPageHTML(){return `<main class="shell"><div class="topbar"><div><div class="eyebrow">OFFICIAL WORD LIST</div><h1>WORD LIST</h1><p class="muted small">90 competition words · Track your mastery.</p></div></div><section class="section">${wordsTab()}</section></main>`}

function practiceOne(word){practiceDifficulty=getWord(word).difficulty;launchPractice([getWord(word)],'spell',getWord(word).difficulty.toUpperCase()+' · Listen & Write')}
function achievementsTab(){return `<div class="achievement-grid">${ACHIEVEMENTS.map(a=>{const unlocked=state.unlocked.includes(a.id);return `<div class="card achievement ${unlocked?'':'locked'}"><div class="badge">${unlocked?a.icon:'🔒'}</div><div class="achievement-title">${a.title}</div><p>${a.desc}</p><div class="ach-progress"><span class="pill">${unlocked?'UNLOCKED':'LOCKED'}</span></div></div>`}).join('')}</div>`}
function historyTab(){if(!state.history.length)return '<div class="card empty"><div class="big">📈</div><h3>Your history starts here.</h3><p class="muted" style="margin-top:5px">Complete a practice session to see meaningful progress.</p></div>';return `<div class="history">${state.history.slice(0,30).map(h=>`<div class="card history-item"><div><div class="eyebrow">${escapeHTML(h.date)}</div><h3 style="margin-top:4px">${escapeHTML(h.mode)}</h3><p class="muted small" style="margin-top:3px">${h.words} words · ${h.accuracy}% accuracy${h.mode==='Bee Mode'?' · Score '+h.score:''}</p></div><span class="pill">+${h.mode==='Bee Mode'?(h.xp||0):30} XP</span></div>`).join('')}</div>`}
function profileHTML(){const l=levelInfo();return `<main class="shell"><div class="topbar"><div><div class="eyebrow">YOUR PROFILE</div><h1>PROFILE</h1></div></div><div class="card profile-card"><div class="avatar">🐝</div><div style="flex:1"><div class="eyebrow">LEVEL ${l.idx+1}</div><h2>${l.name}</h2><p class="muted small" style="margin-top:4px">${l.toNext?l.toNext+' XP to the next level':'MAX LEVEL'}</p></div></div><section class="section"><div class="stats-grid">${[['XP',state.xp],['Words Practiced',state.wordsPracticed.size+'/90'],['Accuracy',overallAccuracy()+'%'],['Current Streak','🔥 '+state.dailyStreak],['Best Streak',state.bestStreak],['Achievements',state.unlocked.length+'/'+ACHIEVEMENTS.length]].map(x=>`<div class="card stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div></section><section class="section"><div class="card smart-card"><div class="eyebrow">DATA</div><h3 style="margin:5px 0">Reset progress</h3><p class="muted small">This erases your practice data, XP, streaks, achievements and history.</p><button class="btn btn-danger btn-full" style="margin-top:12px" onclick="confirmReset()">RESET PROGRESS</button></div></section></main>`}
function confirmReset(){openModal('<h3>ARE YOU SURE?</h3><p>This will erase all your practice data, including XP, mastery, streaks, achievements, daily goals and history.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-danger" onclick="resetProgress()">RESET</button></div>')}
function resetProgress(){localStorage.removeItem(STORAGE_KEY);state=clone(defaultState);state.wordsPracticed=new Set();initDaily();closeModal();go('home');toast('Progress reset. Fresh start!')}
function openModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('overlay').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),1900)}
function confetti(n=20){const c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<n;i++){const x=document.createElement('i');x.style.left=(Math.random()*100)+'%';x.style.top=(-10-Math.random()*20)+'px';x.style.background=['#FFD600','#087FF5','#FF9800','#22C55E','#FFFFFF'][i%5];x.style.transform='rotate('+Math.random()*360+'deg)';x.style.animationDelay=(Math.random()*.2)+'s';c.appendChild(x)}setTimeout(()=>c.innerHTML='',1600)}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function boot(){initDaily();renderScreen('home');ensureAchievements()}
boot();
</script>
</body>
</html>
